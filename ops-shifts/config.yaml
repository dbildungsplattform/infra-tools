# Configuration for SRE On-Call Shift Rotation & Teams Notifications

confluence:
  base_url: "https://docs.dbildungscloud.de"
  calendar_id: "60fe65e8-fcac-4358-bf52-e7188a5fc1c3"
  calendar_name: "SRE"
  calendar_page_url: "https://docs.dbildungscloud.de/spaces/ST/overview"

teams:
  channel_name: "SRE Operations"
  betriebsaufgaben_url: "https://docs.dbildungscloud.de/spaces/ST/pages/534937640/SRE+Betriebsaufgaben+OPS"

rotation:
  timezone: "Europe/Berlin"
  # Duration of each shift in days
  shift_duration_days: 7
  # Shift change day: 0 = Monday, 6 = Sunday
  shift_start_weekday: 0
  # Shift change hour in local time (6 for 06:00 CET/CEST Europe/Berlin)
  shift_start_hour: 6
  # Mindestanzahl an abwesenden Arbeitstagen (Mo–Fr), ab der jemand für die Woche ausgeschlossen wird.
  # HINWEIS: Samstage und Sonntage sind automatisch von der Berechnung ausgeschlossen!
  # 1 = Bereits 1 abwesender Arbeitstag (z.B. Freitag) schließt die Person für die Woche aus
  # 2 = 1 Fehltag (z.B. einzelner Freitag) ist erlaubt; Ausschluss erst ab >= 2 Fehltagen
  vacation_overlap_threshold_days: 1

vacation:
  # Event types and keywords that indicate absence/vacation on the Confluence calendar
  event_keywords:
    - "leave"
    - "leave (planned)"
    - "travel"
    - "urlaub"
    - "vacation"
    - "abwesend"
    - "pto"
    - "holiday"
    - "holidays"
  # Non-absence event types to ignore
  ignore_keywords:
    - "birthday"
    - "geburtstag"
    - "meeting"
    - "retro"
    - "refinement"
    - "daily"
    - "intern"
    - "quarter cap"
    - "pi "

# Team members participating in the on-call rotation.
# 'aliases' are matched against Confluence calendar event summaries/attendees (case-insensitive).
