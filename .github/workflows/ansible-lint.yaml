name: Ansible Lint

on:
  workflow_call:
    inputs:
      requirements-file:
        description: Path to the Ansible collections requirements file
        required: false
        type: string
        default: collections/requirements.yml
      args:
        description: Additional ansible-lint arguments
        required: false
        type: string
        default: "--exclude .ansible"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Run ansible-lint
        uses: ansible/ansible-lint@665d9e07a1943254d2910faffc106adaf7ea7294 # v26.8.0
        with:
          setup_python: "true"
          python_version: "3.14"
          requirements_file: ${{ inputs.requirements-file }}
          args: --sarif-file ansible-lint-results.sarif ${{ inputs.args }}
      - name: Upload ansible-lint results
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ansible-lint-results.sarif