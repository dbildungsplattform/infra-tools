name: Kubeconform

on:
  workflow_call:
    inputs:
      chart-path:
        description: Path to the Helm chart in the caller repository
        required: true
        type: string
      tools-ref:
        description: infra-tools ref containing the shared SARIF converter
        required: false
        default: main
        type: string

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  lint:
    name: Kubeconform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Checkout shared CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dbildungsplattform/infra-tools
          ref: ${{ inputs.tools-ref }}
          path: .infra-tools
          fetch-depth: 1
      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
      - name: Set up Kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@e65429b1e5990dd019ebb7b5642dcd22a3e9cd13 # v0.7.0
      - name: Run Kubeconform
        shell: bash
        env:
          CHART_PATH: ${{ inputs.chart-path }}
        run: |
          export PATH="$(go env GOPATH)/bin:${PATH}"
          set -o pipefail
          helm template --output-dir helm-template "$CHART_PATH"
          kubeconform \
            -schema-location default \
            -schema-location \
          'https://raw.githubusercontent.com/datreeio/CRDs-catalog/'\
          '3348d879deb1cb95a5e93c1c206ffa4a0a494c2c/{{.Group}}/'\
          '{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -strict \
            -output json \
            helm-template \
            | tee kubeconform-results.txt
          python3 .infra-tools/ci-scripts/kubeconform2sarif.py --rewrite-root helm < kubeconform-results.txt > kubeconform-results.sarif
      - name: Upload kubeconform results
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: kubeconform-results.sarif
