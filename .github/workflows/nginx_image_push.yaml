name: Mirror Bitnami NGINX to GHCR
 
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"
 
permissions:
  contents: read
  packages: write
 
jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Set date tag
        id: date
        run: echo "tag=Schedule-1.0.$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 #v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror image to GHCR
        uses: akhilerm/tag-push-action@eadeefebd39db8a47e146115649adae1fce576a6 # v2.3.0
        with:
          src: docker.io/bitnami/nginx:latest
          dst: |
            ghcr.io/${{ github.repository_owner }}/nginx:${{ steps.date.outputs.tag }}