name: Helm Lint

on:
  workflow_call:
    inputs:
      chart-path:
        description: Path to the Helm chart in the caller repository
        required: true
        type: string
      tools-ref:
        description: infra-tools ref containing the shared SARIF converter
        required: true
        type: string

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Checkout shared CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dbildungsplattform/infra-tools
          ref: ${{ inputs.tools-ref }}
          path: .infra-tools
          fetch-depth: 1
      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
      - name: Run helm lint
        shell: bash
        env:
          CHART_PATH: ${{ inputs.chart-path }}
        run: |
          set -o pipefail
          helm lint "$CHART_PATH" | tee helm-lint-results.txt
          python3 .infra-tools/ci-scripts/helm_lint2sarif.py < helm-lint-results.txt > helm-lint-results.sarif
      - name: Upload helm lint results
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: helm-lint-results.sarif