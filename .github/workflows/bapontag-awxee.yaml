# bapontag.yaml does not support the decoration with custom jobs (e.g., generate_dockerfile) in its generalized workflow right now
# also, it does not reference the (mostly duplicated) workflows in *ghcr-on-push.yaml but implements own logic
# as a big refactoring is out of scope of OPS-11278, the bapontag logic for awx-ee is partly duplicated here. however:
# todo: the github workflows in this repo must be refactored

name: awx-ee Build and push Docker Image on Tag

on:
  push:
    tags:
      - "awx-ee-*.*.*"

jobs:
  pre_build:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.extract.outputs.image_name }}
    steps:
      - name: Extract image name from tag
        id: extract
        run: |
          IMAGE_NAME="$(echo "${GITHUB_REF_NAME}" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+$//')"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Image name: ${IMAGE_NAME}"

  generate_dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: install ansible-builder
        run: pip install ansible-builder==3.1.1
      - name: build Dockerfile from execution-environment.yml
        working-directory: awx-ee
        run: ansible-builder create --output-filename Dockerfile
      # see https://github.com/actions/upload-artifact#permission-loss
      - name: tar files
        run: tar -cvf build-code.tar -C awx-ee/context .
      - name: upload build context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build-code.tar
          archive: false
          retention-days: 1

  build_and_push:
    needs:
      - pre_build
      - generate_dockerfile
    uses: dbildungsplattform/dbp-github-workflows/.github/workflows/image-publish-trivy.yaml4b5c0434f28b537e9199ffebc21f4e6e39cbcdde # 8.4.3
    permissions:
      packages: write
      contents: read
      security-events: write
    with:
      image_name: ${{ needs.pre_build.outputs.image_name }}
      container_registry: "ghcr.io"
      add_latest_tag: true
      image_tag_generation: "mmp_git_tag,mm_git_tag"
      context: ./${{ needs.pre_build.outputs.image_name }}
      code_source: "artifact"
      run_trivy_scan: false
      run_clamav_scan: false
      limit-severities-for-sarif: false
    secrets: inherit
