name: OPS Shift Rotation & Teams Notifier

on:
  schedule:
    # Runs Monday and Friday at 05:00 UTC.
    # In Europe/Berlin, this corresponds to 06:00 CET (standard time) or 07:00 CEST (summer time).
    - cron: "0 5 * * 1,5"
  workflow_dispatch:
    inputs:
      card_type:
        description: "Kartentyp / Vorlage (auto, uebersicht, schichtwechsel, vorschau)"
        type: choice
        options:
          - "auto"
          - "uebersicht"
          - "schichtwechsel"
          - "vorschau"
        default: "auto"
      force_rotation:
        description: "Schichtwechsel erzwingen (auch wenn aktuelle Schicht noch aktiv ist)"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (nur testen, weder Teams-Post noch State-Update)"
        type: boolean
        default: false

concurrency:
  group: ops-shifts-rotation
  cancel-in-progress: false

jobs:
  run-ops-shifts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "ops-shifts/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ops-shifts/requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest ops-shifts/test_ops_shifts.py

      - name: Restore on-call state from cache
        uses: actions/cache@v4
        with:
          path: ops-shifts/state.json
          key: ops-shifts-state-${{ github.run_id }}
          restore-keys: |
            ops-shifts-state-

      - name: Initialize state if not cached
        run: |
          mkdir -p ops-shifts
          if [ ! -f ops-shifts/state.json ]; then
            echo "No cached state found. Initializing empty state."
            echo "{}" > ops-shifts/state.json
          else
            echo "Loaded cached state:"
            cat ops-shifts/state.json
          fi

      - name: Execute Ops Shifts Manager
        env:
          CONFLUENCE_PAT: ${{ secrets.CONFLUENCE_PAT }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ "${{ inputs.force_rotation }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force-rotation"
          fi
          if [ -n "${{ inputs.card_type }}" ] && [ "${{ inputs.card_type }}" != "auto" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --card-type ${{ inputs.card_type }}"
          fi

          python ops-shifts/ops_shifts.py --config ops-shifts/config.yaml --state ops-shifts/state.json $EXTRA_ARGS
