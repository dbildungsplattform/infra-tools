name: OPS Shift Rotation & Teams Notifier

on:
  schedule:
    # Runs Monday and Friday at 05:00 UTC.
    # In Europe/Berlin, this corresponds to 06:00 CET (standard time) or 07:00 CEST (summer time).
    - cron: "0 5 * * 1,5"
  workflow_dispatch:
    inputs:
      card_type:
        description: "Vorlage für die Teams-Nachricht"
        type: choice
        options:
          - "uebersicht"
          - "schichtwechsel"
          - "vorschau"
        default: "uebersicht"
      force_rotation:
        description: "Schichtwechsel erzwingen (auch wenn aktuelle Schicht noch aktiv ist)"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (nur testen, weder Teams-Post noch State-Update)"
        type: boolean
        default: false

concurrency:
  group: ops-shifts-rotation
  cancel-in-progress: false

jobs:
  run-ops-shifts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "ops-shifts/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ops-shifts/requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest ops-shifts/test_ops_shifts.py

      # =========================================================================
      # STATE PERSISTENCE DESIGN DECISION: actions/cache
      # -------------------------------------------------------------------------
      # Why actions/cache over alternatives:
      # 1. Zero Infrastructure & Zero Overhead: No external cloud dependencies, IAM
      #    roles, credentials to rotate, or Terraform maintenance for a ~1KB JSON file.
      # 2. Least Privilege Security: Works out-of-the-box with default GITHUB_TOKEN.
      #    Writing GitHub Repo Variables (gh variable set) requires elevated admin PATs,
      #    which introduces unnecessary security/credential management overhead.
      # 3. Clean Git History: Avoids automated Git commits/pushes cluttering branch logs.
      # 4. Low Risk of Expiration: Cache has a 7-day inactivity TTL. Since the workflow
      #    runs bi-weekly (every 3-4 days), the cache is continuously refreshed.
      # 5. Graceful Fallback: Even if evicted (e.g. repo paused for >7 days), state loss is
      #    non-critical: state resets to defaults and automatically re-bootstraps
      #    using Confluence calendar availability without service disruption.
      # =========================================================================
      - name: Restore on-call state from cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ops-shifts/state.json
          key: ops-shifts-state-${{ github.run_id }}
          restore-keys: |
            ops-shifts-state-

      - name: Initialize state if not cached
        run: |
          mkdir -p ops-shifts
          if [ ! -f ops-shifts/state.json ]; then
            echo "No cached state found. Initializing empty state."
            echo "{}" > ops-shifts/state.json
          else
            echo "Loaded cached state:"
            cat ops-shifts/state.json
          fi

      - name: Execute Ops Shifts Manager
        env:
          CONFLUENCE_PAT: ${{ secrets.CONFLUENCE_PAT }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ "${{ inputs.force_rotation }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force-rotation"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.card_type }}" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --card-type ${{ inputs.card_type }}"
            fi
          fi

          python ops-shifts/ops_shifts.py --config ops-shifts/config.yaml --state ops-shifts/state.json $EXTRA_ARGS
