name: SRE On-Call Shift Rotation & Teams Daily Notifier

on:
  schedule:
    # Runs Monday to Friday at 07:30 UTC.
    # In Europe/Berlin, this corresponds to 08:30 CET (standard time) or 09:30 CEST (summer time).
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not post to Teams or commit state to git)"
        type: boolean
        default: false
      force_rotation:
        description: "Force shift rotation even if the current shift is still active"
        type: boolean
        default: false
      mock_calendar:
        description: "Use mock vacation calendar data instead of calling Confluence"
        type: boolean
        default: false

concurrency:
  group: ops-shifts-rotation
  cancel-in-progress: false

jobs:
  run-ops-shifts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "ops-shifts/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ops-shifts/requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest ops-shifts/test_ops_shifts.py

      - name: Execute Ops Shifts Manager
        env:
          CONFLUENCE_PAT: ${{ secrets.CONFLUENCE_PAT }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ "${{ inputs.force_rotation }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force-rotation"
          fi
          if [ "${{ inputs.mock_calendar }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --mock-calendar"
          fi

          python ops-shifts/ops_shifts.py $EXTRA_ARGS

      - name: Commit updated rotation state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet ops-shifts/state.json; then
            echo "State file changed. Committing and pushing..."
            git add ops-shifts/state.json
            git commit -m "chore(ops-shifts): update on-call rotation state [skip ci]"
            git push
          else
            echo "No changes in ops-shifts/state.json to commit."
          fi
