name: SRE On-Call Shift Rotation & Teams Notifier

on:
  schedule:
    # Runs Monday and Friday at 05:00 UTC.
    # In Europe/Berlin, this corresponds to 06:00 CET (standard time) or 07:00 CEST (summer time).
    - cron: "0 5 * * 1,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not post to Teams or update state)"
        type: boolean
        default: false
      force_rotation:
        description: "Force shift rotation even if the current shift is still active"
        type: boolean
        default: false
      mock_calendar:
        description: "Use mock vacation calendar data instead of calling Confluence"
        type: boolean
        default: false

concurrency:
  group: ops-shifts-rotation
  cancel-in-progress: false

jobs:
  run-ops-shifts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      variables: write  # Enables updating the ONCALL_STATE repository variable (zero git commits)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "ops-shifts/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ops-shifts/requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest ops-shifts/test_ops_shifts.py

      - name: Retrieve state from GitHub Variable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p ops-shifts
          if gh variable get ONCALL_STATE > ops-shifts/state.json 2>/dev/null; then
            echo "Successfully loaded ONCALL_STATE from repository variables."
          else
            echo "Variable ONCALL_STATE not found or empty. Initializing with default state."
            echo "{}" > ops-shifts/state.json
          fi

      - name: Execute Ops Shifts Manager
        env:
          CONFLUENCE_PAT: ${{ secrets.CONFLUENCE_PAT }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ "${{ inputs.force_rotation }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force-rotation"
          fi
          if [ "${{ inputs.mock_calendar }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --mock-calendar"
          fi

          python ops-shifts/ops_shifts.py --config ops-shifts/config.yaml --state ops-shifts/state.json $EXTRA_ARGS

      - name: Persist updated state to GitHub Variable
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -s ops-shifts/state.json ]; then
            gh variable set ONCALL_STATE < ops-shifts/state.json
            echo "Successfully updated GitHub Variable ONCALL_STATE."
          fi
