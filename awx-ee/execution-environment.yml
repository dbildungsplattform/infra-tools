---
version: 3
images:
  base_image:
    name: quay.io/centos/centos:stream9
dependencies:
  ansible_core:
    package_pip: ansible-core==2.20.7
  ansible_runner:
    package_pip: ansible-runner==2.4.1
  galaxy: _build/requirements.yml
  system: _build/bindep.txt
  python_interpreter:
    package_system: "python312"
    python_path: "/usr/bin/python3.12"
  python: _build/requirements.txt
options:
  user: '1000'
additional_build_steps:
  prepend_final: |
    ARG HELM_VERSION=3.18.2
    ARG OPENTOFU_VERSION=1.12.4
    ARG KUBECTL_VERSION=1.34.2
    ARG OP_VERSION=2.34.1
    ARG AGE_VERSION=1.3.1
    RUN pip3 install --no-cache-dir --upgrade pip setuptools
    RUN dnf install -y unzip openssl libcurl-minimal git && dnf upgrade --refresh -y && dnf clean all
    RUN cd /tmp && \
        curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/opentofu/get.opentofu.org/3d354dfa62d9a36f33df16cdd6bb506ace1e6e2e/static/install-opentofu.sh -o install-opentofu.sh && \
        chmod +x /tmp/install-opentofu.sh && \
        /tmp/install-opentofu.sh --install-method standalone --opentofu-version ${OPENTOFU_VERSION} --install-path /tmp/ && \
        install -o root -g root -m 0755 /tmp/tofu /usr/local/bin/tofu && \
        rm -f /tmp/install-opentofu.sh /tmp/tofu && \
        curl -fsSLO https://dl.k8s.io/release/v$KUBECTL_VERSION/bin/linux/amd64/kubectl && \
        install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl && \
        rm -f kubectl && \
        curl -fsSLO https://cache.agilebits.com/dist/1P/op2/pkg/v$OP_VERSION/op_linux_amd64_v$OP_VERSION.zip && \
        unzip -o op_linux_amd64_v$OP_VERSION.zip && \
        install -o root -g root -m 0755 op /usr/local/bin/op && \
        rm -f op_linux_amd64_v$OP_VERSION.zip op op.sig && \
        curl -fsSLO https://get.helm.sh/helm-v$HELM_VERSION-linux-amd64.tar.gz && \
        tar -xf helm-v$HELM_VERSION-linux-amd64.tar.gz && \
        install -o root -g root -m 0755 linux-amd64/helm /usr/local/bin/helm && \
        rm -rf linux-amd64 helm-v$HELM_VERSION-linux-amd64.tar.gz && \
        curl -fsSLO https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz && \
        tar -xf age-v${AGE_VERSION}-linux-amd64.tar.gz && \
        install -o root -g root -m 0755 age/age /usr/local/bin/age && \
        rm -rf age v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz
    RUN export LANGUAGE="C.UTF-8"
  append_final:
    - RUN update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 1
